<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>V-Taper Coach</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="V-Taper">
<meta name="theme-color" content="#11151b">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0} body{margin:0} img{max-width:100%} [hidden]{display:none!important} html,body{overscroll-behavior-y:none} input,select{font-size:16px!important}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Manrope:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: phone app shell. One column, max 520px, fixed bottom tab bar. Day colors follow gym plate colors: Push red, Pull blue, Legs yellow, V-Taper green. */
:root{
  --bg:#11151b; --surface:#1a2029; --surface2:#242c37; --line:#323d4b;
  --fg:#e9eef4; --muted:#8e9bac;
  --red:#ee5459; --blue:#4a95f8; --yellow:#f2c230; --green:#43b783;
  --on-plate:#0d1116;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef1f5; --surface:#ffffff; --surface2:#e5eaf1; --line:#d2d9e3;
    --fg:#131920; --muted:#5b687a;
    --red:#d2353b; --blue:#1d6ee0; --yellow:#b8870c; --green:#1d8a59;
    --on-plate:#ffffff;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#eef1f5; --surface:#ffffff; --surface2:#e5eaf1; --line:#d2d9e3;
  --fg:#131920; --muted:#5b687a;
  --red:#d2353b; --blue:#1d6ee0; --yellow:#b8870c; --green:#1d8a59;
  --on-plate:#ffffff;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;padding:0 16px;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding-block:14px calc(110px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:34px}
h2{font-size:24px}
h3{font-size:19px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.section{display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:10px 14px;font-weight:700;font-size:14px}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.sm{padding:7px 11px;font-size:13px}
.chip{background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-weight:600;font-size:13px;white-space:nowrap}
.chip b{font-family:var(--f-num);font-weight:500;color:var(--muted);margin-left:4px}
input,select{font:inherit;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
input{font-family:var(--f-num)}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;text-align:right}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--green)}

.plate{display:inline-flex;align-items:center;gap:8px}
.plate i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 4px var(--pc);flex:none}
.p-red{--pc:var(--red)} .p-blue{--pc:var(--blue)} .p-yellow{--pc:var(--yellow)} .p-green{--pc:var(--green)} .p-gray{--pc:var(--muted)}

.hero{border-radius:var(--r);padding:18px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--pc)}
.hero .meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--pc,var(--fg));border-radius:99px;transition:width .3s}
.banner{border-radius:12px;padding:10px 14px;background:var(--surface2);font-size:13px;font-weight:600;border:1px dashed var(--line)}

.rings{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ring{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.ring svg{width:112px;height:112px}
.ring .v{font-family:var(--f-num);font-size:20px}
.ring .t{font-size:12px;color:var(--muted)}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-weight:700}
.wd .pip{width:28px;height:28px;border-radius:50%;border:2px solid var(--pc)}
.wd.done .pip{background:var(--pc)}
.wd.today{color:var(--fg)}
.wd.today .pip{outline:2px solid var(--fg);outline-offset:2px}

.tl{display:flex;flex-direction:column}
.tl-i{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.tl-i:first-child{border-top:0}
.tl-i .tm{font-family:var(--f-num);font-size:13px;color:var(--muted);padding-top:1px}
.tl-i.past{opacity:.5}
.tl-i.next .tm{color:var(--fg)}
.tl-i.next{background:linear-gradient(90deg,var(--surface2),transparent);border-radius:8px;padding-left:8px;margin-left:-8px}

.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{background:none;border:0;border-radius:7px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.dchip{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:54px;padding:8px 6px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:700}
.dchip .plate i{width:12px;height:12px;box-shadow:inset 0 0 0 3px var(--pc)}
.dchip[aria-pressed="true"]{border-color:var(--fg);background:var(--surface2)}
.dchip small{font-weight:600;color:var(--muted);font-size:10px}
.ex{display:flex;flex-direction:column;gap:10px}
.ex-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-h h3{font-size:20px}
.spec{font-family:var(--f-num);font-size:13px;color:var(--muted);white-space:nowrap}
.tag{display:inline-block;font-family:var(--f-body);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:99px;border:1px solid var(--pc);color:var(--pc);vertical-align:3px;margin-left:6px}
.cue{font-size:13px;color:var(--muted)}
.hint{font-size:13px;font-weight:600;border-radius:9px;padding:7px 10px;background:var(--surface2)}
.hint.up{color:var(--green)}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:44px 1fr 1fr 46px;gap:8px;align-items:center}
.set .sn{font-size:12px;font-weight:700;color:var(--muted)}
.set label{position:relative;display:block}
.set label span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);pointer-events:none}
.set input{width:100%;padding-right:34px}
.ck{width:46px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center}
.ck svg{width:20px;height:20px}
.set.done .ck{background:var(--pc);border-color:var(--pc);color:var(--on-plate)}
.set.done input{opacity:.65}

.big{font-family:var(--f-num);font-size:40px;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.log{display:flex;flex-direction:column}
.log-i{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px;gap:10px}
.log-i:first-child{border-top:0}
.x{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw{width:52px;height:30px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--green);border-color:var(--green)}
.sw[aria-checked="true"]::after{transform:translateX(22px);background:var(--on-plate)}
.targets{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tgt{background:var(--surface2);border-radius:10px;padding:10px 12px}
.tgt .num{font-size:18px}
.meal{display:grid;grid-template-columns:58px 1fr auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.meal:first-child{border-top:0}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-num);font-size:10px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .tline{stroke:var(--fg);stroke-dasharray:4 4;stroke-width:1.2;opacity:.7}
.form2{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.empty{font-size:14px;color:var(--muted);padding:6px 0}

.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(488px,calc(100% - 32px));background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 12px 10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.rest .num{font-size:26px}
.rest button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:9px;padding:6px 10px;font-weight:700;font-size:13px}
.rest.go{background:var(--green);color:var(--on-plate)}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 16px calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
.tabs nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:700;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--fg)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div>
      <div class="label" id="dateLabel">Today</div>
      <h1 id="pageTitle">Today</h1>
    </div>
    <div class="sync" id="sync"><span class="dot"></span><span>Saved on this device</span></div>
  </header>

  <section id="v-today" class="section"></section>
  <section id="v-train" class="section" hidden></section>
  <section id="v-fuel" class="section" hidden></section>
  <section id="v-progress" class="section" hidden></section>
</div>

<div class="rest" id="rest" hidden>
  <div><div class="label" style="color:inherit;opacity:.7" id="restLabel">Rest</div><div class="num" id="restTime">1:30</div></div>
  <div class="row"><button type="button" id="restAdd">+15s</button><button type="button" id="restSkip">Skip</button></div>
</div>

<div class="tabs">
  <nav role="tablist" aria-label="Sections">
    <button class="tab" role="tab" data-tab="today" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Today</button>
    <button class="tab" role="tab" data-tab="train" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>Train</button>
    <button class="tab" role="tab" data-tab="fuel" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-7 6-11z"/></svg>Fuel</button>
    <button class="tab" role="tab" data-tab="progress" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M6 15l4-4 3 3 5-6"/></svg>Progress</button>
  </nav>
</div>

<script>
(function(){
"use strict";

/* ===== Exercise library: id -> [name, weight step kg, coaching cue] ===== */
const LIB = {
  incline_bb:["Incline Barbell Press",2.5,"Bench at 30°. Bar touches upper chest. Drive up and slightly back."],
  incline_smith:["Incline Smith Press",2.5,"Bench at 30°. Lower to upper chest, elbows about 45° from your body."],
  incline_db:["Incline Dumbbell Press",2,"Bench at 30°. Dumbbells come down wide to upper chest."],
  incline_machine:["Incline Machine Press",2.5,"Handles line up with upper chest. Slow on the way back."],
  flat_db:["Flat Dumbbell Press",2,"Shoulder blades pinned back. Lower slow for 2 seconds."],
  flat_bb:["Flat Barbell Bench Press",2.5,"Feet planted, small arch. Bar touches lower chest."],
  machine_chest:["Machine Chest Press",2.5,"Slow on the way back. Squeeze at the front."],
  chest_dips:["Chest Dips",2.5,"Lean forward a little and go deep. Log added weight, 0 for bodyweight."],
  seated_db_ohp:["Seated Dumbbell Shoulder Press",2,"Stop just short of lockout to keep tension on the delts."],
  machine_ohp:["Machine Shoulder Press",2.5,"Seat so the handles start at chin height."],
  arnold:["Arnold Press",2,"Start palms facing you, turn them out as you press."],
  standing_ohp:["Standing Barbell Press",2.5,"Squeeze glutes and abs. Push your head through once the bar passes your face."],
  landmine_press:["Half Kneeling Landmine Press",2.5,"Press up and forward. Easy on the shoulders. Each arm."],
  cable_lat:["Cable Lateral Raise",1.25,"Lead with the elbow. Lift out to the side, not forward. This builds width."],
  db_lat:["Dumbbell Lateral Raise",1,"Light weight, strict form. Pinkies slightly up."],
  machine_lat:["Machine Lateral Raise",2.5,"Pads on your elbows. Pause at the top."],
  leanaway_lat:["Lean Away Cable Lateral Raise",1.25,"Hold the post and lean out. Long stretch at the bottom. Each arm."],
  seated_db_lat:["Seated Dumbbell Lateral Raise",1,"Sitting kills the swing. Take 3 seconds on the way down."],
  cable_y:["Cable Y Raise",1.25,"Raise your arms into a Y shape. Hits the side and top of the delt."],
  low_high_fly:["Low to High Cable Fly",1.25,"Hands sweep up to chin height. Squeeze the upper chest."],
  incline_db_fly:["Incline Dumbbell Fly",1,"Soft elbows. Deep stretch, then hug a big tree."],
  pec_deck:["Pec Deck Fly",2.5,"Chest up. Squeeze for one second in the middle."],
  mid_cable_fly:["Cable Crossover",1.25,"Step forward, slight lean. Hands meet at chest height."],
  rope_pd:["Rope Triceps Pushdown",2.5,"Elbows glued to your sides. Spread the rope at the bottom."],
  bar_pd:["Straight Bar Pushdown",2.5,"Lock your elbows in place. Full lockout every rep."],
  sa_pd_rev:["Single Arm Reverse Grip Pushdown",1.25,"Palm up. Squeeze at the bottom. Each arm."],
  oh_cable_tri:["Overhead Cable Triceps Extension",2.5,"Big stretch behind the head. This hits the long head."],
  db_oh_tri:["Dumbbell Overhead Extension",2,"One dumbbell, both hands. Lower deep behind your head."],
  skull:["EZ Bar Skull Crusher",2.5,"Bar goes just behind your head. Elbows point up."],
  dips:["Triceps Dips",2.5,"Stay upright. Log added weight, 0 for bodyweight."],
  cgbp:["Close Grip Bench Press",2.5,"Hands shoulder width apart. Elbows tucked in."],
  machine_dip:["Machine Dip",2.5,"Sit tall and press down to full lockout."],
  sa_cable_pd:["Single Arm Cable Pushdown",1.25,"One arm at a time. Squeeze hard at lockout."],

  pullup:["Pull-up",2.5,"Log added weight, 0 for bodyweight. Pull elbows down to your ribs."],
  neutral_pullup:["Neutral Grip Pull-up",2.5,"Palms face each other. Chest to the bar. 0 for bodyweight."],
  heavy_pd:["Heavy Wide Pulldown",2.5,"Heavy but controlled. Pull to upper chest, no swinging."],
  wide_pd:["Wide Grip Lat Pulldown",2.5,"Chest up. Pull to the top of your chest. Control the way up."],
  sa_pd:["Single Arm Cable Pulldown",1.25,"Big stretch at the top. Each arm counts as one set."],
  machine_pd:["Machine Pulldown",2.5,"Drive your elbows down into your back pockets."],
  neutral_pd:["Close Neutral Grip Pulldown",2.5,"Lean back a little. Elbows drive down and back."],
  chinup:["Chin-up",2.5,"Palms facing you. Great for lats and biceps. 0 for bodyweight."],
  tbar_row:["Chest Supported T-Bar Row",2.5,"Chest stays on the pad. Squeeze shoulder blades together."],
  cable_row:["Seated Cable Row",2.5,"Sit tall. Pull to your belly and pause."],
  machine_row:["Machine Row",2.5,"Chest on the pad. Pull elbows past your body."],
  cs_db_row:["Chest Supported Dumbbell Row",2,"Lie face down on an incline bench. Row to your hips."],
  bb_row:["Barbell Row",2.5,"Torso at 45°. Pull to your belly button. No jerking."],
  landmine_row:["Landmine T-Bar Row",2.5,"Hinge over with a flat back. Pull the plates to your chest."],
  machine_row_heavy:["Heavy Machine Row",2.5,"Chest on the pad. Go heavy but keep it strict."],
  sa_db_row:["Single Arm Dumbbell Row",2,"Pull the dumbbell to your hip, not your chest."],
  sa_cable_row:["Single Arm Cable Row",1.25,"Reach forward for a stretch, then row to your hip."],
  meadows:["Meadows Row",2.5,"Stand side on to a landmine. Row with your elbow flared."],
  wide_cable_row:["Wide Grip Seated Cable Row",2.5,"Elbows flare out. Hits upper back and rear delts."],
  high_row:["Machine High Row",2.5,"Pull down and back at an angle. Squeeze your mid back."],
  straight_arm_pd:["Straight Arm Cable Pulldown",2.5,"Arms almost straight. Sweep the bar to your thighs. Feel the lats."],
  db_pullover:["Dumbbell Pullover",2,"Lie across a bench. Lower behind your head for a big lat stretch."],
  rope_pullover:["Rope Cable Pullover",2.5,"Hinge forward and pull the rope to your thighs."],
  face_pull:["Face Pull",2.5,"Pull to your eyes, thumbs back. Keeps shoulders healthy and wide."],
  reverse_pec:["Reverse Pec Deck",2.5,"Light and strict. Rear delts make shoulders look round from the side."],
  rear_cable_fly:["Rear Delt Cable Fly",1.25,"Cross the cables and pull wide. Arms stay long."],
  bent_rear_raise:["Bent Over Rear Delt Raise",1,"Chest near your knees. Lift out wide, leading with the pinkies."],
  ez_curl:["EZ Bar Curl",2.5,"No swinging. Elbows stay still."],
  bb_curl:["Barbell Curl",2.5,"Stand tall. Curl up, lower slow."],
  alt_db_curl:["Alternating Dumbbell Curl",1,"Turn the palm up as you curl."],
  incline_db_curl:["Incline Dumbbell Curl",1,"Arms hang behind you for a full stretch."],
  bayesian:["Bayesian Cable Curl",1.25,"Face away from the cable. Arm stays behind you. Each arm."],
  preacher:["Preacher Curl",2.5,"Do not let your elbows lift off the pad."],
  hammer:["Hammer Curl",1,"Thumbs up. Builds arm thickness."],
  rope_hammer:["Rope Hammer Curl",2.5,"Thumbs up on the rope. Squeeze at the top."],
  rev_ez_curl:["Reverse Grip EZ Curl",2.5,"Palms down. Builds forearms and arm thickness."],
  cable_curl:["Cable Curl",2.5,"Squeeze hard at the top."],
  concentration:["Concentration Curl",1,"Elbow on your inner thigh. Slow and strict."],
  spider:["Spider Curl",1,"Chest on an incline bench, arms hang straight down."],

  squat:["Back Squat",5,"Brace hard. Hips go below knee level if you can keep a flat back."],
  hack_squat:["Hack Squat",5,"Feet low on the platform for more quads. Go deep and slow."],
  smith_squat:["Smith Machine Squat",5,"Feet a little forward. Sit straight down."],
  rdl:["Romanian Deadlift",5,"Push hips back, slight knee bend. Stop when hamstrings are fully stretched."],
  db_rdl:["Dumbbell Romanian Deadlift",2,"Dumbbells slide down your thighs. Flat back the whole time."],
  smith_rdl:["Smith Machine Romanian Deadlift",5,"Hips back, bar close to your legs. Feel the hamstrings."],
  leg_press:["Leg Press",10,"Feet mid platform. Do not let your lower back lift off the pad."],
  bss:["Bulgarian Split Squat",2,"Rear foot on a bench. Front knee tracks over your toes. Each leg."],

function isDeload(w){return w%8===0;}
const planCache = {};
function plan(w){
  if(planCache[w]) return planCache[w];
  const block=Math.floor((w-1)/4), out={};
  Object.keys(DAYS).forEach(dk=>{
    const D=DAYS[dk], used=[];
    const ex=D.slots.map(sl=>{
      const [pool,sets,reps,rest,rot]=sl; let i=(rot==="b"?block:(w-1))%pool.length, tries=0;
      while(used.includes(pool[i])&&tries<pool.length){i=(i+1)%pool.length;tries++;}
      const id=pool[i]; used.push(id); const L=LIB[id];
      return {id,n:L[0],inc:L[1],cue:L[2],sets:isDeload(w)?Math.max(2,sets-1):sets,reps,rest,main:rot==="b"};
    });
    out[dk]={name:D.name,focus:D.focus,plate:D.plate,ex};
  });
  return planCache[w]=out;
}
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function weekOf(k){return Math.max(1,Math.floor(Math.round((mondayOf(parseKey(k))-START)/864e5)/7)+1);}

function save(key){
  lsSet();
  if(!refs) return;
  dirty[key]=true;
  clearTimeout(saveT); saveT=setTimeout(flush,700);
}
async function flush(){
  for(const k of Object.keys(dirty)){
    if(!dirty[k]||writing[k]) continue;
    dirty[k]=false; writing[k]=true;
    try{ await refs[k].set(clone(k==="body"?S.body:{m:S[k]})); setSync(true); }
    catch(e){ dirty[k]=true; setSync(false,"Could not sync. Saved on this device."); }
    finally{ writing[k]=false; if(dirty[k]){clearTimeout(saveT);saveT=setTimeout(flush,1200);} }
  }
}

async function connect(){
  if(!(window.claude&&window.claude.use)) return;
  try{
    const [user,db]=await Promise.all([window.claude.use("user"),window.claude.use("db")]);
    if(!user||!db) return;
    const uid=await user.id(); if(!uid) return;
    const col=db.collection("data/users/"+uid);
    refs={days:col.doc("days"),lifts:col.doc("lifts"),body:col.doc("body")};
    const [d,l,b]=await Promise.all([refs.days.get(),refs.lifts.get(),refs.body.get()]);
    const pushLocal=[];
    if(d.exists){S.days=Object.assign({},S.days,clone(d.data().m||{}));} else if(Object.keys(S.days).length) pushLocal.push("days");
    if(l.exists){S.lifts=Object.assign({},S.lifts,clone(l.data().m||{}));} else if(Object.keys(S.lifts).length) pushLocal.push("lifts");
    if(b.exists){const r=clone(b.data());S.body={w:mergeW(S.body.w||[],r.w||[])};} else if((S.body.w||[]).length) pushLocal.push("body");
    lsSet(); setSync(true);

}
function mergeW(a,b){const m={};a.concat(b).forEach(x=>{m[x.d]=x;});return Object.values(m).sort((x,y)=>x.d<y.d?-1:1);}

/* ===== Dates ===== */
function key(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function parseKey(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d);}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
const now=()=>new Date();
function todayKey(){return key(now());}
function day(k){k=k||todayKey(); if(!S.days[k]) S.days[k]={p:[],w:0,c:false}; return S.days[k];}
function peekDay(k){return S.days[k]||{p:[],w:0,c:false};}
function progFor(k){const d=S.days[k]; if(d&&d.prog) return d.prog; return WEEK[parseKey(k).getDay()];}
function PD(k){const p=progFor(k);return p==="match"?null:plan(weekOf(k))[p];}
function waterTarget(k){return parseKey(k).getDay()===0?T.waterMatch:T.water;}
function protein(k){return peekDay(k).p.reduce((a,x)=>a+x[0],0);}

/* ===== Lifts ===== */
function sessionToday(id){const arr=S.lifts[id]||[];const t=todayKey();return arr.find(s=>s.d===t);}
function lastSession(id){const arr=(S.lifts[id]||[]).filter(s=>s.d!==todayKey()&&s.s.some(Boolean));return arr[arr.length-1];}
function repRange(r){const m=/^(\d+)(?:-(\d+))?$/.exec(r);if(!m)return null;return {lo:+m[1],hi:+(m[2]||m[1])};}
function fmtW(w){return (Math.round(w*100)/100).toString();}
function hintFor(e,deload){
  const last=lastSession(e.id); const rr=repRange(e.reps);
  if(deload){const t=last?Math.max(...last.s.filter(Boolean).map(s=>s[0])):0;return {cls:"",t:"Deload: use about 60% of normal"+(t?", around "+fmtW(Math.round(t*0.6/2.5)*2.5)+" kg":"")+". Easy reps, perfect form."};}
  if(!last) return {cls:"",t:"New lift for you. Pick a weight you can do for "+e.reps+" reps with 1 to 2 reps left in the tank."};
  const sets=last.s.filter(Boolean); const top=Math.max(...sets.map(s=>s[0]));
  const txt=sets.map(s=>fmtW(s[0])+"×"+s[1]).join(", ");
  const ago=Math.round((parseKey(todayKey())-parseKey(last.d))/864e5);
  const when=ago>10?" ("+Math.round(ago/7)+" weeks ago)":"";
  if(!rr) return {cls:"",t:"Last time: "+txt+when+". Try to hold a little longer."};
  const all=sets.length>=e.sets && sets.every(s=>s[1]>=rr.hi);
  if(all && e.inc>0) return {cls:"up",t:"Go heavier: try "+fmtW(top+e.inc)+" kg. Last time: "+txt+when};
  if(all) return {cls:"up",t:"You hit the top of the range. Add a rep or slow the reps down. Last: "+txt+when};
  return {cls:"",t:"Stay at "+fmtW(top)+" kg and add a rep. Last time: "+txt+when};
}
function lastTopW(id){const l=lastSession(id);if(!l)return "";const s=l.s.filter(Boolean);return fmtW(Math.max(...s.map(x=>x[0])));}
function doneSets(k){let n=0;const p=PD(k);if(!p)return 0;p.ex.forEach(e=>{const s=(S.lifts[e.id]||[]).find(x=>x.d===k);if(s)n+=s.s.filter(Boolean).length;});return n;}
function totalSets(p){return p?p.ex.reduce((a,e)=>a+e.sets,0):0;}
function trainedOn(k){return Object.values(S.lifts).some(arr=>arr.some(s=>s.d===k&&s.s.some(Boolean)));}

  $("#v-train").innerHTML=head+'<div class="days" role="group" aria-label="Pick a day">'+chips+'</div>'+body;
}

function exCard(e,live,plate,isNew,deload){
  const st=live?sessionToday(e.id):null; const h=hintFor(e,deload); const lw=lastTopW(e.id); const rr=repRange(e.reps);
  let rows="";
  for(let i=0;i<e.sets;i++){
    const s=st&&st.s[i];
    rows+='<div class="set p-'+plate+(s?' done':'')+'"><span class="sn">Set '+(i+1)+'</span>'
      +'<label><input id="w-'+e.id+'-'+i+'" inputmode="decimal" aria-label="Weight set '+(i+1)+'" placeholder="'+(lw||"0")+'" value="'+(s?fmtW(s[0]):"")+'"'+(live?"":" disabled")+'><span>kg</span></label>'
      +'<label><input id="r-'+e.id+'-'+i+'" inputmode="numeric" aria-label="Reps set '+(i+1)+'" placeholder="'+(rr?rr.hi:parseInt(e.reps))+'" value="'+(s?s[1]:"")+'"'+(live?"":" disabled")+'><span>reps</span></label>'
      +'<button class="ck" aria-label="'+(s?"Undo set ":"Done set ")+(i+1)+'" data-act="set" data-id="'+e.id+'" data-i="'+i+'"'+(live?"":" disabled")+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></button></div>';
  }
  const tags=(e.main?'<span class="tag p-'+plate+'">Main lift</span>':'')+(isNew?'<span class="tag p-green">New</span>':'');
  return '<div class="card ex" id="ex-'+e.id+'"><div class="ex-h"><h3>'+esc(e.n)+tags+'</h3><span class="spec">'+e.sets+' × '+esc(e.reps)+' · '+fmtRest(e.rest)+'</span></div>'
    +'<div class="cue">'+esc(e.cue)+'</div><div class="hint '+h.cls+'">'+esc(h.t)+'</div><div class="sets">'+rows+'</div></div>';
}
function fmtRest(s){return s>=60?(Math.floor(s/60)+":"+String(s%60).padStart(2,"0")+" rest"):(s+"s rest");}

function renderFuel(){

    +'<div class="chips" style="margin-top:14px">'+FOODS.map(f=>'<button class="chip" data-act="addP" data-g="'+f[1]+'" data-n="'+esc(f[0])+'">'+esc(f[0])+'<b>'+f[1]+'g</b></button>').join("")+'</div>'
    +'<div class="form2" style="margin-top:12px;grid-template-columns:1fr 90px auto"><input id="cpN" placeholder="Other food" style="font-family:var(--f-body)"><input id="cpG" inputmode="numeric" placeholder="g"><button class="btn sm" data-act="addCustom">Add</button></div>'

    +'<div class="tgt"><div class="label">Carbs</div><div class="num">~'+T.carbs+' g</div></div><div class="tgt"><div class="label">Fat</div><div class="num">~'+T.fat+' g</div></div></div>'

    +'<p class="muted" style="font-size:13px;margin:10px 0 0">Keep tea before 5 pm so it does not mess with your sleep after the gym.</p></div>';
}

function renderProgress(){
  const W=(S.body.w||[]).slice().sort((a,b)=>a.d<b.d?-1:1);
  let summary='<div class="empty">Weigh yourself every Monday morning, after the toilet and before food. Log it here.</div>';
  if(W.length>=2){
    const last=W[W.length-1]; const ref=W.slice().reverse().find(x=>(parseKey(last.d)-parseKey(x.d))/864e5>=21)||W[0];
    const weeks=Math.max((parseKey(last.d)-parseKey(ref.d))/(7*864e5),1);
    const rate=(last.kg-ref.kg)/weeks;
    let msg,cls="";
    if(rate>0.35){msg="Gaining a bit fast. Drop about 200 calories a day (one cup of rice) so you stay lean.";}
    else if(rate>=0.1){msg="Right on track. Slow and steady gain means mostly muscle.";cls="up";}
    else if(rate>-0.1){msg="Weight is flat. Add about 200 calories a day: a banana and a glass of milk.";}
    else {msg="You are losing weight. Eat more: add a meal or a second shake.";}
    let waist="";const wl=W.filter(x=>x.waist);if(wl.length>=2){const dw=wl[wl.length-1].waist-wl[0].waist;waist=' Waist '+(dw>=0?"+":"")+dw.toFixed(1)+' cm since you started'+(dw>2?'. Waist going up fast means extra fat, so trim carbs a little.':'.');}
    summary='<div class="row" style="align-items:baseline;gap:8px"><span class="big">'+(rate>=0?"+":"")+rate.toFixed(2)+'</span><span class="muted">kg per week</span></div><div class="hint '+cls+'" style="margin-top:10px">'+msg+waist+'</div>';
  } else if(W.length===1){summary='<div class="empty">Got your first weigh-in. Log again next Monday to see your trend.</div>';}
  const lastW=W.length?W[W.length-1]:null;
  const keys=[];for(let i=13;i>=0;i--)keys.push(key(addDays(now(),-i)));
  const pv=keys.map(protein), wv=keys.map(k=>+(peekDay(k).w/1000).toFixed(2));
  const labels=keys.map(k=>DAYN[parseKey(k).getDay()][0]);
  const withHist=Object.keys(LIB).filter(id=>(S.lifts[id]||[]).some(s=>s.s.some(Boolean)));
  let sel=lsUi("lift"); if(!sel||!LIB[sel]) sel=withHist[0]||"incline_bb";
  const opts=Object.keys(LIB).sort((a,b)=>(withHist.includes(b)-withHist.includes(a))||LIB[a][0].localeCompare(LIB[b][0])).map(id=>'<option value="'+id+'"'+(id===sel?" selected":"")+'>'+esc(LIB[id][0])+(withHist.includes(id)?"":" (no logs)")+'</option>').join("");
  const hist=(S.lifts[sel]||[]).filter(s=>s.s.some(Boolean)).map(s=>{const st=s.s.filter(Boolean);const top=st.reduce((b,x)=>x[0]>b[0]||(x[0]===b[0]&&x[1]>b[1])?x:b,st[0]);return {d:s.d,v:top[0],r:top[1]};});
  const best=hist.reduce((b,x)=>!b||x.v>b.v||(x.v===b.v&&x.r>b.r)?x:b,null);

  $("#v-progress").innerHTML=
    '<div class="card stack"><div class="label">Body weight</div>'
    +'<div class="form2"><input id="bwKg" inputmode="decimal" placeholder="'+(lastW?lastW.kg:"75")+' kg" aria-label="Weight in kg"><input id="bwWaist" inputmode="decimal" placeholder="Waist cm" aria-label="Waist in cm (optional)"><button class="btn sm primary" data-act="addW">Log</button></div>'
    +(W.length?lineChart(W.map(x=>({x:x.d,y:x.kg})),"--green"):'')
    +summary
    +(W.length?'<div class="log">'+W.slice(-4).reverse().map(x=>'<div class="log-i"><span class="num muted">'+x.d+'</span><span class="row"><span class="num">'+x.kg+' kg'+(x.waist?' · '+x.waist+' cm':'')+'</span><button class="x" aria-label="Remove entry" data-act="rmW" data-d="'+x.d+'">×</button></span></div>').join("")+'</div>':'')
    +'</div>'
    +'<div class="card stack"><div class="row between"><div class="label">Protein, last 14 days</div><span class="muted num" style="font-size:12px">target '+T.protein+' g</span></div>'+barChart(pv,labels,T.protein,"--red","g")+'</div>'
    +'<div class="card stack"><div class="row between"><div class="label">Water, last 14 days</div><span class="muted num" style="font-size:12px">target 3.5 L</span></div>'+barChart(wv,labels,3.5,"--blue","L")+'</div>'
    +'<div class="card stack"><div class="label">Lift progress</div><select id="liftSel" aria-label="Pick an exercise">'+opts+'</select>'
    +(hist.length?lineChart(hist.map(h=>({x:h.d,y:h.v})),"--yellow")+'<div class="row between"><span class="muted" style="font-size:13px">Best set</span><span class="num">'+fmtW(best.v)+' kg × '+best.r+'</span></div><div class="muted" style="font-size:13px">'+hist.length+' sessions logged. The line shows your heaviest set each session.</div>'
      :'<div class="empty">No sets logged for this lift yet. Tick off sets in the Train tab and your chart shows up here.</div>')
    +'</div>'
    +'<div class="card"><div class="label">How your plan changes</div><p style="margin:8px 0 0;font-size:14px">Every Monday you get fresh accessory exercises, so your muscles get new angles. Your main lifts stay the same for 4 weeks so you can keep adding weight to them. When you hit the top rep on every set, go up a little next time. Every 8th week is a lighter deload week to recover.</p></div>'
    +(inFrame?'':'<div class="card stack"><div class="label">Backup</div><p class="muted" style="font-size:13px;margin:0">Your data lives on this phone. Save a backup now and then, so you never lose your progress.</p><div class="row wrap"><button class="btn sm" data-act="export">Save backup</button><label class="btn sm" for="importFile" style="display:inline-block">Restore backup</label><input type="file" id="importFile" accept="application/json,.json" hidden></div><div id="bkMsg" class="muted" style="font-size:13px"></div></div>');
}

function barChart(vals,labels,target,color,unit){
  const w=340,h=150,pl=30,pr=6,pt=10,pb=20; const max=Math.max(target*1.25,...vals,1);
  const iw=w-pl-pr, ih=h-pt-pb, bw=iw/vals.length;
  const y=v=>pt+ih-(v/max)*ih;
  const nice=unit==="L"?[0,target/2,target]:[0,Math.round(target/2),target];
  let s='<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Bar chart">';
  nice.forEach(v=>{s+='<line class="grid" x1="'+pl+'" x2="'+(w-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(pl-4)+'" y="'+(y(v)+3)+'" text-anchor="end">'+v+'</text>';});
  vals.forEach((v,i)=>{const bh=Math.max((v/max)*ih,v>0?2:0);const hit=v>=target;
    s+='<rect x="'+(pl+i*bw+bw*0.18)+'" y="'+(pt+ih-bh)+'" width="'+(bw*0.64)+'" height="'+bh+'" rx="3" fill="var('+color+')" opacity="'+(hit?1:0.45)+'"/>';
    s+='<text x="'+(pl+i*bw+bw/2)+'" y="'+(h-6)+'" text-anchor="middle"'+(i===vals.length-1?' style="fill:var(--fg)"':'')+'>'+labels[i]+'</text>';});
  s+='<line class="tline" x1="'+pl+'" x2="'+(w-pr)+'" y1="'+y(target)+'" y2="'+y(target)+'"/>';
  return s+'</svg>';
}
function lineChart(pts,color){
  const w=340,h=150,pl=34,pr=10,pt=12,pb=22;
  if(pts.length===1){pts=[pts[0],pts[0]];}
  const ys=pts.map(p=>p.y); let lo=Math.min(...ys), hi=Math.max(...ys); if(hi-lo<2){const m=(hi+lo)/2;lo=m-1;hi=m+1;} const pad=(hi-lo)*0.15; lo-=pad; hi+=pad;
  const iw=w-pl-pr, ih=h-pt-pb;
  const x=i=>pl+i*iw/(pts.length-1); const y=v=>pt+ih-((v-lo)/(hi-lo))*ih;
  const ticks=[lo+pad,(lo+hi)/2,hi-pad];
  let s='<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Line chart">';
  ticks.forEach(v=>{s+='<line class="grid" x1="'+pl+'" x2="'+(w-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(pl-4)+'" y="'+(y(v)+3)+'" text-anchor="end">'+(Math.round(v*10)/10)+'</text>';});
  const path=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.y).toFixed(1)).join(" ");
  s+='<path d="'+path+' L'+x(pts.length-1).toFixed(1)+' '+(pt+ih)+' L'+x(0).toFixed(1)+' '+(pt+ih)+' Z" fill="var('+color+')" opacity=".12"/>';
  s+='<path d="'+path+'" fill="none" stroke="var('+color+')" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  const li=pts.length-1;
  s+='<circle cx="'+x(li)+'" cy="'+y(pts[li].y)+'" r="4.5" fill="var('+color+')" stroke="var(--surface)" stroke-width="2"/>';
  const f=d=>{const p=d.split("-");return p[2]+"/"+p[1];};
  s+='<text x="'+x(0)+'" y="'+(h-6)+'" text-anchor="start">'+f(pts[0].x)+'</text><text x="'+x(li)+'" y="'+(h-6)+'" text-anchor="end">'+f(pts[li].x)+'</text>';
  return s+'</svg>';
}

/* ===== Rest timer ===== */
let restEnd=0, restInt=null;
function startRest(sec,name){
  restEnd=Date.now()+sec*1000; $("#restLabel").textContent="Rest · "+name; const el=$("#rest"); el.hidden=false; el.classList.remove("go");
  clearInterval(restInt); restInt=setInterval(tickRest,250); tickRest();
}
function tickRest(){
  const left=Math.max(0,Math.round((restEnd-Date.now())/1000)); const el=$("#rest");
  $("#restTime").textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
  if(left<=0){clearInterval(restInt);el.classList.add("go");$("#restLabel").textContent="Rest done";$("#restTime").textContent="Next set";try{navigator.vibrate&&navigator.vibrate(200);}catch(e){}setTimeout(()=>{if(Date.now()>=restEnd)el.hidden=true;},4000);}
}
$("#restAdd").onclick=()=>{restEnd=Math.max(restEnd,Date.now())+15000;$("#rest").classList.remove("go");clearInterval(restInt);restInt=setInterval(tickRest,250);tickRest();};
$("#restSkip").onclick=()=>{clearInterval(restInt);$("#rest").hidden=true;};

/* ===== Backup (installed app only) ===== */
async function exportData(){
  const blob=new Blob([JSON.stringify({app:"vtaper",v:1,saved:new Date().toISOString(),data:S})],{type:"application/json"});
  const name="vtaper-backup-"+todayKey()+".json";
  try{
    const file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"V-Taper backup"});$("#bkMsg").textContent="Backup ready. Save it to Files or iCloud.";return;}
  }catch(e){if(e&&e.name==="AbortError")return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  $("#bkMsg").textContent="Backup saved as "+name+".";
}
document.addEventListener("change",ev=>{
  if(ev.target.id==="liftSel"){lsUi("lift",ev.target.value);renderProgress();}
  if(ev.target.id==="importFile"&&ev.target.files[0]){
    const r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result);if(o.app!=="vtaper"||!o.data)throw 0;loadInto(o.data);lsSet();renderAll();const m=$("#bkMsg");if(m)m.textContent="Backup restored.";}catch(e){$("#bkMsg").textContent="That file is not a V-Taper backup. Pick the .json file you saved.";}};
    r.readAsText(ev.target.files[0]);
  }
});

/* ===== Actions ===== */
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act, k=todayKey();
  if(a==="water"){const d=day(k);d.w=Math.max(0,d.w+(+b.dataset.v));save("days");rerender();}
  else if(a==="creatine"){const d=day(k);d.c=!d.c;save("days");rerender();}
  else if(a==="addP"){day(k).p.push([+b.dataset.g,b.dataset.n]);save("days");rerender();}
  else if(a==="addCustom"){const g=parseInt($("#cpG").value,10);if(!(g>0)){$("#cpG").focus();return;}const n=$("#cpN").value.trim()||"Other";day(k).p.push([g,n.slice(0,40)]);save("days");rerender();}
  else if(a==="rmP"){day(k).p.splice(+b.dataset.i,1);save("days");rerender();}
  else if(a==="goFuel"){setTab("fuel");}
  else if(a==="openTrain"){trainView=null;weekOffset=0;setTab("train");}
  else if(a==="trainDay"){trainView=b.dataset.p;renderTrain();}
  else if(a==="wk"){weekOffset=+b.dataset.o;renderTrain();}
  else if(a==="swap"){day(k).prog=b.dataset.p;trainView=b.dataset.p;weekOffset=0;save("days");renderAll();}
  else if(a==="unswap"){delete day(k).prog;trainView=null;save("days");renderAll();}
  else if(a==="set"){logSet(b.dataset.id,+b.dataset.i);}
  else if(a==="export"){exportData();}
  else if(a==="addW"){
    const kg=parseFloat($("#bwKg").value); if(!(kg>30&&kg<250)){$("#bwKg").focus();return;}
    const wa=parseFloat($("#bwWaist").value);
    const e={d:k,kg:Math.round(kg*10)/10}; if(wa>40&&wa<200)e.waist=Math.round(wa*10)/10;
    S.body.w=mergeW(S.body.w||[],[e]); save("body"); renderProgress();
  }
  else if(a==="rmW"){S.body.w=(S.body.w||[]).filter(x=>x.d!==b.dataset.d);save("body");renderProgress();}
});

function logSet(id,i){
  const k=todayKey(); const P=PD(k); if(!P) return; const e=P.ex.find(x=>x.id===id); if(!e) return;
  if(!S.lifts[id]) S.lifts[id]=[];
  let s=S.lifts[id].find(x=>x.d===k); if(!s){s={d:k,s:[]};S.lifts[id].push(s);}
  if(s.s[i]){ s.s[i]=null; }
  else{
    const wi=$("#w-"+id+"-"+i), ri=$("#r-"+id+"-"+i);
    let w=parseFloat(wi.value); if(isNaN(w)) w=parseFloat(wi.placeholder)||0;
    let r=parseInt(ri.value,10); if(isNaN(r)) r=parseInt(ri.placeholder,10)||0;
    if(r<=0){ri.focus();return;}
    s.s[i]=[w,r];
    startRest(e.rest,e.n);
  }
  while(s.s.length&&!s.s[s.s.length-1]) s.s.pop();
  if(!s.s.length) S.lifts[id]=S.lifts[id].filter(x=>x!==s);
  if(S.lifts[id].length>24) S.lifts[id]=S.lifts[id].slice(-24);
  save("lifts");
  const typed={}; document.querySelectorAll("#ex-"+id+" input").forEach(inp=>typed[inp.id]=inp.value);
  const w=weekOf(k); const prev=w>1?plan(w-1)[progFor(k)].ex.map(x=>x.id):[];
  const card=document.getElementById("ex-"+id);
  const tmp=document.createElement("div"); tmp.innerHTML=exCard(e,true,P.plate,w>1&&!prev.includes(id),isDeload(w)); card.replaceWith(tmp.firstChild);
  document.querySelectorAll("#ex-"+id+" input").forEach(inp=>{if(!inp.value&&typed[inp.id])inp.value=typed[inp.id];});
  if(s.s[i]){const nw=$("#w-"+id+"-"+(i+1));if(nw&&!nw.value)nw.placeholder=fmtW(s.s[i][0]);}
}

/* ===== Tabs ===== */
const TITLES={today:"Today",train:"Train",fuel:"Fuel",progress:"Progress"};
function setTab(t){
  tab=t; lsUi("tab",t);
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t?"true":"false"));
  ["today","train","fuel","progress"].forEach(v=>document.getElementById("v-"+v).hidden=v!==t);
  $("#pageTitle").textContent=TITLES[t];
  rerender(); window.scrollTo(0,0);
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
function rerender(){
  const d=now(); $("#dateLabel").textContent=DAYFULL[d.getDay()]+", "+d.getDate()+" "+d.toLocaleString("en",{month:"short"});
  if(tab==="today")renderToday(); else if(tab==="train")renderTrain(); else if(tab==="fuel")renderFuel(); else renderProgress();
}
function renderAll(){trimDays();rerender();}

let lastKey=todayKey();
setInterval(()=>{if(todayKey()!==lastKey){lastKey=todayKey();trainView=null;weekOffset=0;rerender();} else if(tab==="today"){renderToday();}},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&tab!=="train")rerender();});

window.__vtaper={plan,weekOf};
setTab(tab);
connect();
if(!inFrame&&"serviceWorker" in navigator&&location.protocol==="https:"){try{navigator.serviceWorker.register("sw.js");}catch(e){}}
