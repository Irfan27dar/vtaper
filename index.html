<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>V-Taper Coach</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="V-Taper">
<meta name="theme-color" content="#c9ece2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px)} body{margin:0} img{max-width:100%} [hidden]{display:none!important} html,body{overscroll-behavior-y:none}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone app shell on a mint-to-peach gradient, frosted glass cards, floating glass tab bar.
   Teal = training, coral = food, blue = water, amber = body. One light look by design. */
:root{
  --bg1:#c9ece2; --bg2:#f5efe5; --bg3:#fad2bf;
  --glass:rgba(255,255,255,.56); --glass-hi:rgba(255,255,255,.82); --stroke:rgba(255,255,255,.9);
  --ink:#1b2a28; --muted:#6a7a77; --faint:rgba(27,42,40,.08);
  --teal:#1fa487; --teal-d:#16876f; --teal-s:#d2efe7;
  --coral:#ef7757; --coral-s:#fde1d7;
  --blue:#4f8fe8; --blue-s:#dbe8fb;
  --amber:#e49b30; --amber-s:#fbebd2;
  --white:#ffffff;
  --shadow:0 10px 30px rgba(38,78,68,.10);
  --f:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:24px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg2);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.45;padding:0 16px;-webkit-tap-highlight-color:transparent}
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(60% 40% at 10% 8%,rgba(150,220,200,.75),transparent 70%),
    radial-gradient(55% 45% at 95% 95%,rgba(250,180,150,.7),transparent 70%),
    linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%)}
.app{max-width:500px;margin:0 auto;padding-block:16px calc(120px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance;line-height:1.15}
h1{font-size:24px} h2{font-size:21px} h3{font-size:15px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.section{display:flex;flex-direction:column;gap:14px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(140%);backdrop-filter:blur(20px) saturate(140%);border:1px solid var(--stroke);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.ctitle{font-size:15px;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--glass-hi);border:1px solid var(--stroke);border-radius:14px;padding:10px 12px;min-width:0;font-size:16px}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--glass);border:1px solid var(--stroke);display:grid;place-items:center;flex:none;position:relative;box-shadow:var(--shadow)}
.iconbtn svg{width:20px;height:20px}
.iconbtn .d{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--muted);border:2px solid var(--white)}
.iconbtn .d.ok{background:var(--teal)}

/* buttons */
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:0;border-radius:999px;padding:8px 8px 8px 22px;background:var(--teal);color:var(--white);font-weight:600;font-size:15px;box-shadow:0 8px 20px rgba(31,164,135,.3)}
.cta .arr{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center}
.cta .arr svg{width:18px;height:18px}
.cta.coral{background:var(--coral);box-shadow:0 8px 20px rgba(239,119,87,.3)}
.cta.center{justify-content:center;padding:14px 22px}
.cta.inline{width:auto}
.pill{border:1px solid var(--stroke);background:var(--glass-hi);border-radius:999px;padding:8px 14px;font-weight:500;font-size:13px;white-space:nowrap}
.pill b{font-weight:600;color:var(--muted);margin-left:4px}
.pill[aria-pressed="true"]{background:var(--teal);color:var(--white);border-color:var(--teal)}
.pill[aria-pressed="true"] small{color:rgba(255,255,255,.8)}
.seg{display:flex;background:rgba(255,255,255,.55);border:1px solid var(--stroke);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;background:none;border:0;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--white);box-shadow:0 4px 12px rgba(31,164,135,.3)}
.link{background:none;border:0;color:var(--teal-d);font-weight:600;font-size:13px;padding:4px 0}

/* home */
.prog{display:grid;grid-template-columns:128px 1fr;gap:16px;align-items:center}
.ringbox{position:relative;width:128px;height:128px}
.ringbox svg{width:100%;height:100%}
.ringbox .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ringbox .c b{font-size:26px;font-weight:600;display:block;line-height:1}
.ringbox .c span{font-size:11px;color:var(--muted)}
.legend{display:flex;flex-direction:column;gap:9px;min-width:0}
.lg{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;font-size:13px}
.lg i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.lg span{color:var(--muted)}
.lg b{font-weight:600}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px;margin-top:10px}
.bcol{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bcol .b{width:14px;border-radius:99px;background:var(--teal-s);min-height:8px;position:relative}
.bcol.now .b{background:var(--teal)}
.bcol .tip{font-size:10px;font-weight:600;background:var(--ink);color:var(--white);border-radius:6px;padding:1px 5px}
.bcol small{font-size:11px;color:var(--muted);font-weight:500}
.bcol.now small{color:var(--ink);font-weight:600}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbtn{display:flex;align-items:center;gap:10px;background:var(--glass-hi);border:1px solid var(--stroke);border-radius:18px;padding:12px;font-weight:500;font-size:13px;text-align:left}
.qbtn .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--s);color:var(--c);flex:none}
.qbtn .ic svg{width:18px;height:18px}
.qbtn small{display:block;color:var(--muted);font-size:11px;font-weight:400}

.hero{position:relative;overflow:hidden;border-radius:var(--r);padding:20px;border:1px solid var(--stroke);box-shadow:var(--shadow);
  background:linear-gradient(135deg,rgba(255,255,255,.85),rgba(255,255,255,.35)),linear-gradient(135deg,var(--hs1),var(--hs2))}
.hero .art{position:absolute;right:-10px;top:-10px;width:120px;height:120px;opacity:.13;color:var(--hc);pointer-events:none}
.hero>*:not(.art){position:relative}
.hero .eyebrow{font-size:12px;color:var(--muted);font-weight:500}
.hero h2{font-size:24px;margin-top:4px;max-width:75%}
.hero .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.hero .meta span{font-size:12px;background:rgba(255,255,255,.7);border-radius:99px;padding:4px 10px;font-weight:500}
.d-push{--hs1:#fde1d7;--hs2:#fbefe6;--hc:var(--coral)}
.d-pull{--hs1:#d2efe7;--hs2:#eef8f4;--hc:var(--teal)}
.d-legs{--hs1:#fbebd2;--hs2:#fdf5ea;--hc:var(--amber)}
.d-vt{--hs1:#dbe8fb;--hs2:#eff4fd;--hc:var(--blue)}
.d-match{--hs1:#e7ecea;--hs2:#f6f8f7;--hc:var(--muted)}
.track{height:8px;border-radius:99px;background:rgba(27,42,40,.08);overflow:hidden}
.track>span{display:block;height:100%;border-radius:99px;background:var(--c,var(--teal));transition:width .3s}
.banner{border-radius:18px;padding:12px 14px;background:var(--amber-s);color:#6b4a14;font-size:13px;font-weight:500;border:1px solid var(--stroke)}

.tl{display:flex;flex-direction:column}
.tl-i{display:grid;grid-template-columns:54px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--faint);font-size:13px}
.tl-i:first-child{border-top:0}
.tl-i .tm{font-weight:600;color:var(--muted);font-size:12px;padding-top:1px}
.tl-i.past{opacity:.45}
.tl-i.next{background:var(--teal-s);border-radius:14px;padding-left:10px;padding-right:10px;margin:2px -10px;border-top-color:transparent}
.tl-i.next .tm{color:var(--teal-d)}

/* workouts */
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.dpill{display:flex;flex-direction:column;align-items:center;min-width:62px;padding:8px 10px;border-radius:18px;border:1px solid var(--stroke);background:var(--glass-hi);font-weight:600;font-size:13px}
.dpill small{font-weight:400;font-size:10px;color:var(--muted)}
.dpill[aria-pressed="true"]{background:var(--teal);color:var(--white);border-color:var(--teal)}
.dpill[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.exlist{display:flex;flex-direction:column;gap:10px}
.ex{background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--stroke);border-radius:20px;box-shadow:var(--shadow)}
.exrow{display:grid;grid-template-columns:46px 1fr 28px;gap:12px;align-items:center;width:100%;background:none;border:0;text-align:left;padding:12px}
.thumb{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--s);color:var(--c);position:relative}
.thumb svg{width:24px;height:24px}
.thumb .ok{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:var(--teal);color:var(--white);display:grid;place-items:center;border:2px solid var(--white)}
.thumb .ok svg{width:10px;height:10px}
.exrow h3{font-size:14px;font-weight:600}
.exrow .sub{font-size:12px;color:var(--muted);margin-top:1px}
.chev{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:transform .2s}
.chev svg{width:16px;height:16px}
.ex.open .chev{transform:rotate(90deg)}
.tag{display:inline-block;font-size:10px;font-weight:600;padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:1px}
.tag.main{background:var(--ink);color:var(--white)}
.tag.new{background:var(--teal-s);color:var(--teal-d)}
.exbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.cue{font-size:12.5px;color:var(--muted)}
.hint{font-size:12.5px;font-weight:500;border-radius:12px;padding:8px 12px;background:rgba(255,255,255,.7)}
.hint.up{background:var(--teal-s);color:var(--teal-d)}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:38px 1fr 1fr 44px;gap:8px;align-items:center}
.set .sn{font-size:12px;font-weight:600;color:var(--muted)}
.set label{position:relative;display:block}
.set label span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);pointer-events:none}
.set input{width:100%;padding-right:36px}
.ck{width:44px;height:42px;border-radius:14px;border:1px solid var(--stroke);background:var(--glass-hi);display:grid;place-items:center;color:var(--muted)}
.ck svg{width:18px;height:18px}
.set.done .ck{background:var(--teal);border-color:var(--teal);color:var(--white)}
.set.done input{opacity:.6}
.set input:disabled,.ck:disabled{opacity:.55}

/* nutrition */
.big{font-size:30px;font-weight:600;line-height:1}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:12px}
.mini .lbl{font-size:12px;color:var(--muted)}
.mini .v{font-size:17px;font-weight:600}
.mini svg{width:36px;height:36px;align-self:flex-end;margin-top:-4px}
.meals{display:flex;flex-direction:column;gap:8px}
.meal{display:grid;grid-template-columns:46px 1fr 38px;gap:12px;align-items:center;background:var(--glass-hi);border:1px solid var(--stroke);border-radius:18px;padding:8px 10px}
.meal .food{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--coral-s)}
.meal .t{font-size:11px;color:var(--muted)}
.meal .n{font-weight:600;font-size:13.5px}
.meal .g{font-size:12px;color:var(--muted)}
.mk{width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(27,42,40,.15);background:var(--white);display:grid;place-items:center;color:var(--muted)}
.mk svg{width:16px;height:16px}
.mk[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--white)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.log{display:flex;flex-direction:column}
.log-i{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--faint);font-size:13px;gap:10px}
.log-i:first-child{border-top:0}
.x{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px}
.form2{display:grid;grid-template-columns:1fr 84px;gap:8px}
.targets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tgt{background:rgba(255,255,255,.7);border-radius:14px;padding:10px 8px;text-align:center}
.tgt b{display:block;font-size:15px;font-weight:600}
.tgt span{font-size:11px;color:var(--muted)}

/* stats */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f);font-size:10px}
.chart .grid{stroke:rgba(27,42,40,.08);stroke-width:1}
.chart .tline{stroke:var(--ink);stroke-dasharray:3 4;stroke-width:1;opacity:.35}
.chart .tipbg{fill:var(--ink)} .chart .tiptx{fill:var(--white);font-weight:600;font-size:10px}
.rings{display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:center}
.rings svg{width:140px;height:140px}
.empty{font-size:13px;color:var(--muted);padding:4px 0}
.wform{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.btn{border:0;border-radius:14px;padding:10px 16px;font-weight:600;font-size:13px;background:var(--teal);color:var(--white)}
.btn.ghost{background:var(--glass-hi);color:var(--ink);border:1px solid var(--stroke)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw{width:50px;height:30px;border-radius:99px;background:rgba(27,42,40,.12);border:0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--white);box-shadow:0 2px 6px rgba(0,0,0,.15);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--teal)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}

/* rest timer */
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));width:min(468px,calc(100% - 32px));background:rgba(27,42,40,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:var(--white);border-radius:22px;padding:10px 10px 10px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:20;box-shadow:0 14px 34px rgba(0,0,0,.25)}
.rest .lbl{font-size:11px;opacity:.75}
.rest .num{font-size:24px;font-weight:600}
.rest button{background:rgba(255,255,255,.14);border:0;color:inherit;border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px}
.rest.go{background:var(--teal)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:10;pointer-events:none}
.tabs nav{pointer-events:auto;max-width:468px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--stroke);border-radius:26px;box-shadow:0 12px 30px rgba(38,78,68,.14);padding:6px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;font-size:11px;font-weight:500;color:var(--muted);border-radius:20px}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--teal-d);background:var(--teal-s)}
/* pull to refresh */
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:30;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;background:rgba(255,255,255,.85);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--stroke);box-shadow:var(--shadow);font-size:12px;font-weight:500;color:var(--muted);transform:translate(-50%,-80px);opacity:0;pointer-events:none}
.ptr .spin{width:26px;height:26px;border-radius:50%;background:var(--teal-s);color:var(--teal-d);display:grid;place-items:center}
.ptr .spin svg{width:15px;height:15px;transition:transform .15s}
.ptr.ready .spin svg{transform:rotate(180deg)}
.ptr.busy .spin svg{animation:ptrspin .8s linear infinite}
.ptr.anim{transition:transform .25s ease,opacity .25s ease}
@keyframes ptrspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}.ptr.busy .spin svg{animation:none}}
</style>
</head>
<body>

<div class="bgfx" aria-hidden="true"></div>
<div class="ptr" id="ptr" role="status" aria-live="polite"><span class="spin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg></span><span id="ptrText">Pull to refresh</span></div>
<div class="app">
  <header class="top">
    <div>
      <h1 id="pageTitle">Hi, Irfan 👋</h1>
      <div class="sub" id="pageSub">Ready to crush your goals?</div>
    </div>
    <div class="iconbtn" id="sync" title="Saved on this device" aria-label="Saved on this device">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.7-8.95A6 6 0 0 1 17.8 8.5 4 4 0 0 1 17 18z"/></svg><span class="d"></span>
    </div>
  </header>

  <section id="v-today" class="section"></section>
  <section id="v-train" class="section" hidden></section>
  <section id="v-fuel" class="section" hidden></section>
  <section id="v-progress" class="section" hidden></section>
</div>

<div class="rest" id="rest" hidden>
  <div><div class="lbl" id="restLabel">Rest</div><div class="num" id="restTime">1:30</div></div>
  <div class="row"><button type="button" id="restAdd">+15s</button><button type="button" id="restSkip">Skip</button></div>
</div>

<div class="tabs">
  <nav role="tablist" aria-label="Sections">
    <button class="tab" role="tab" data-tab="today" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button class="tab" role="tab" data-tab="train" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 9v6M6 6.5v11M18 6.5v11M21 9v6M6 12h12"/></svg>Workouts</button>
    <button class="tab" role="tab" data-tab="fuel" aria-selected="false">

  }catch(e){ setSync(false,"Offline. Saved on this device."); }
}
function mergeW(a,b){const m={};a.concat(b).forEach(x=>{m[x.d]=x;});return Object.values(m).sort((x,y)=>x.d<y.d?-1:1);}

/* ===== Dates ===== */
function key(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function parseKey(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d);}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
const now=()=>new Date();
function todayKey(){return key(now());}
function day(k){k=k||todayKey(); if(!S.days[k]) S.days[k]={p:[],w:0,c:false}; return S.days[k];}
function peekDay(k){return S.days[k]||{p:[],w:0,c:false};}
function progFor(k){const d=S.days[k]; if(d&&d.prog) return d.prog; return WEEK[parseKey(k).getDay()];}
function PD(k){const p=progFor(k);return p==="match"?null:plan(weekOf(k))[p];}
function waterTarget(k){return parseKey(k).getDay()===0?T.waterMatch:T.water;}
function protein(k){return peekDay(k).p.reduce((a,x)=>a+x[0],0);}

/* ===== Lifts ===== */
function sessionToday(id){const arr=S.lifts[id]||[];const t=todayKey();return arr.find(s=>s.d===t);}
function lastSession(id){const arr=(S.lifts[id]||[]).filter(s=>s.d!==todayKey()&&s.s.some(Boolean));return arr[arr.length-1];}
function repRange(r){const m=/^(\d+)(?:-(\d+))?$/.exec(r);if(!m)return null;return {lo:+m[1],hi:+(m[2]||m[1])};}
function fmtW(w){return (Math.round(w*100)/100).toString();}
function hintFor(e,deload){
  const last=lastSession(e.id); const rr=repRange(e.reps);
  if(deload){const t=last?Math.max(...last.s.filter(Boolean).map(s=>s[0])):0;return {cls:"",t:"Deload: use about 60% of normal"+(t?", around "+fmtW(Math.round(t*0.6/2.5)*2.5)+" kg":"")+". Easy reps, perfect form."};}
  if(!last) return {cls:"",t:"New lift for you. Pick a weight you can do for "+e.reps+" reps with 1 to 2 reps left in the tank."};
  const sets=last.s.filter(Boolean); const top=Math.max(...sets.map(s=>s[0]));
  const txt=sets.map(s=>fmtW(s[0])+"×"+s[1]).join(", ");
  const ago=Math.round((parseKey(todayKey())-parseKey(last.d))/864e5);
  const when=ago>10?" ("+Math.round(ago/7)+" weeks ago)":"";
  if(!rr) return {cls:"",t:"Last time: "+txt+when+". Try to hold a little longer."};
  const all=sets.length>=e.sets && sets.every(s=>s[1]>=rr.hi);
  if(all && e.inc>0) return {cls:"up",t:"Go heavier: try "+fmtW(top+e.inc)+" kg. Last time: "+txt+when};
  if(all) return {cls:"up",t:"You hit the top of the range. Add a rep or slow the reps down. Last: "+txt+when};
  return {cls:"",t:"Stay at "+fmtW(top)+" kg and add a rep. Last time: "+txt+when};
}
function lastTopW(id){const l=lastSession(id);if(!l)return "";const s=l.s.filter(Boolean);return fmtW(Math.max(...s.map(x=>x[0])));}
function setsOn(k){return Object.values(S.lifts).reduce((n,arr)=>{const s=arr.find(x=>x.d===k);return n+(s?s.s.filter(Boolean).length:0);},0);}
function doneSets(k){let n=0;const p=PD(k);if(!p)return 0;p.ex.forEach(e=>{const s=(S.lifts[e.id]||[]).find(x=>x.d===k);if(s)n+=s.s.filter(Boolean).length;});return n;}
function totalSets(p){return p?p.ex.reduce((a,e)=>a+e.sets,0):0;}

const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function toneOf(prog){return prog==="match"?"match":DAYS[prog].tone;}
function progName(prog){return prog==="match"?"Match Day":DAYS[prog].name;}
function weekLabel(w){const b=Math.floor((w-1)/4)+1;return "Week "+w+" · Block "+b+(isDeload(w)?" · Deload":"");}
function arc(r,p,color,w,bg){
  const c=2*Math.PI*r; p=Math.max(0,Math.min(p,1));
  return (bg!==false?'<circle cx="60" cy="60" r="'+r+'" fill="none" stroke="'+(bg||'rgba(27,42,40,.08)')+'" stroke-width="'+w+'"/>':'')
    +(p<=0?'':'<circle cx="60" cy="60" r="'+r+'" fill="none" stroke="var('+color+')" stroke-width="'+w+'" stroke-linecap="round" stroke-dasharray="'+(c*p).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 60 60)"/>');
}
function miniRing(p,color){return '<svg viewBox="0 0 120 120" aria-hidden="true">'+arc(46,p,color,16)+'</svg>';}

function dayScore(k){
  const P=PD(k); const parts=[];
  if(P){const ts=totalSets(P);parts.push(ts?Math.min(doneSets(k)/ts,1):0);}
  parts.push(Math.min(protein(k)/T.protein,1));
  parts.push(Math.min(peekDay(k).w/waterTarget(k),1));
  parts.push(peekDay(k).c?1:0);
  return parts.reduce((a,b)=>a+b,0)/parts.length;
}

function exCard(e,live,tone,isNew,deload){

    +'<span style="min-width:0"><h3>'+esc(e.n)+tags+'</h3><div class="sub num">'+e.sets+' sets × '+esc(e.reps)+' reps · '+fmtRest(e.rest)+(live&&done?' · '+done+' done':'')+'</div></span>'

    }
    html+='<div class="exbody"><div class="cue">'+esc(e.cue)+'</div><div class="hint '+h.cls+'">'+esc(h.t)+'</div><div class="sets">'+rows+'</div></div>';

function renderProgress(){
  setHeader("Stats", "Your trends over time");
  const W=(S.body.w||[]).slice().sort((a,b)=>a.d<b.d?-1:1);
  let summary='<div class="empty">Weigh yourself every Monday morning, after the toilet and before food.</div>';
  if(W.length>=2){
    const last=W[W.length-1]; const ref=W.slice().reverse().find(x=>(parseKey(last.d)-parseKey(x.d))/864e5>=21)||W[0];
    const weeks=Math.max((parseKey(last.d)-parseKey(ref.d))/(7*864e5),1);
    const rate=(last.kg-ref.kg)/weeks; let msg,cls="";
    if(rate>0.35){msg="Gaining a bit fast. Drop about 200 calories a day (one cup of rice) so you stay lean.";}
    else if(rate>=0.1){msg="Right on track. Slow and steady gain means mostly muscle.";cls="up";}
    else if(rate>-0.1){msg="Weight is flat. Add about 200 calories a day: a banana and a glass of milk.";}
    else {msg="You are losing weight. Eat more: add a meal or a second shake.";}
    let waist="";const wl=W.filter(x=>x.waist);if(wl.length>=2){const dw=wl[wl.length-1].waist-wl[0].waist;waist=' Waist '+(dw>=0?"+":"")+dw.toFixed(1)+' cm since you started'+(dw>2?'. Waist going up fast means extra fat, so trim carbs a little.':'.');}
    summary='<div class="row" style="align-items:baseline;gap:8px"><span class="big num">'+(rate>=0?"+":"")+rate.toFixed(2)+'</span><span class="muted">kg per week</span></div><div class="hint '+cls+'">'+msg+waist+'</div>';
  } else if(W.length===1){summary='<div class="empty">Got your first weigh-in. Log again next Monday to see your trend.</div>';}
  const lastW=W.length?W[W.length-1]:null;
  const N=statRange; const keys=[];for(let i=N-1;i>=0;i--)keys.push(key(addDays(now(),-i)));
  const pv=keys.map(protein), wv=keys.map(k=>+(peekDay(k).w/1000).toFixed(2));
  const labels=keys.map((k,i)=>N<=7?DAYN[parseKey(k).getDay()][0]:(i%5===0||i===N-1?String(parseKey(k).getDate()):""));
  const logged=pv.filter(v=>v>0); const avgP=logged.length?Math.round(logged.reduce((a,b)=>a+b,0)/logged.length):0;
  const hitP=pv.filter(v=>v>=T.protein).length; const hitW=wv.filter(v=>v>=3.5).length;
  const k=todayKey(); const P=PD(k);
  const rp=Math.min(protein(k)/T.protein,1), rw=Math.min(peekDay(k).w/waterTarget(k),1), rs=P?Math.min(doneSets(k)/totalSets(P),1):1;
  const withHist=Object.keys(LIB).filter(id=>(S.lifts[id]||[]).some(s=>s.s.some(Boolean)));
  let sel=lsUi("lift"); if(!sel||!LIB[sel]) sel=withHist[0]||"incline_bb";
  const opts=Object.keys(LIB).sort((a,b)=>(withHist.includes(b)-withHist.includes(a))||LIB[a][0].localeCompare(LIB[b][0])).map(id=>'<option value="'+id+'"'+(id===sel?" selected":"")+'>'+esc(LIB[id][0])+(withHist.includes(id)?"":" (no logs)")+'</option>').join("");
  const hist=(S.lifts[sel]||[]).filter(s=>s.s.some(Boolean)).map(s=>{const st=s.s.filter(Boolean);const top=st.reduce((b,x)=>x[0]>b[0]||(x[0]===b[0]&&x[1]>b[1])?x:b,st[0]);return {d:s.d,v:top[0],r:top[1]};});
  const best=hist.reduce((b,x)=>!b||x.v>b.v||(x.v===b.v&&x.r>b.r)?x:b,null);
  const f=d=>{const p=d.split("-");return p[2]+"/"+p[1];};

  $("#v-progress").innerHTML=
    '<div class="seg" role="group" aria-label="Range"><button aria-pressed="'+(N===7)+'" data-act="range" data-n="7">Week</button><button aria-pressed="'+(N===30)+'" data-act="range" data-n="30">Month</button></div>'
    +'<div class="glass stack"><div class="row between"><div class="ctitle">Protein</div><span class="small muted">'+hitP+' of '+N+' days on target</span></div>'
      +'<div class="row" style="align-items:baseline;gap:8px"><span class="big num">'+avgP+' g</span><span class="small muted">daily average</span></div>'
      +areaChart(pv,labels,"--coral",T.protein,"g")+'</div>'
    +'<div class="glass"><div class="ctitle" style="margin-bottom:12px">Today\'s Rings</div><div class="rings"><svg viewBox="0 0 120 120" aria-hidden="true">'
      +arc(52,rp,"--coral",10)+arc(39,rw,"--blue",10)+arc(26,rs,"--teal",10)+'</svg><div class="legend">'
      +'<div class="lg" style="--c:var(--coral)"><i></i><span>Protein</span><b class="num">'+protein(k)+'/'+T.protein+' g</b></div>'
      +'<div class="lg" style="--c:var(--blue)"><i></i><span>Water</span><b class="num">'+(peekDay(k).w/1000).toFixed(1)+'/'+(waterTarget(k)/1000)+' L</b></div>'
      +'<div class="lg" style="--c:var(--teal)"><i></i><span>Sets</span><b class="num">'+(P?doneSets(k)+'/'+totalSets(P):"Rest")+'</b></div></div></div></div>'
    +'<div class="glass stack"><div class="row between"><div class="ctitle">Water</div><span class="small muted">'+hitW+' of '+N+' days at 3.5 L</span></div>'+barChart(wv,labels,3.5,"--teal")+'</div>'
    +'<div class="glass stack"><div class="ctitle">Body Weight</div>'
      +'<div class="wform"><input id="bwKg" inputmode="decimal" placeholder="'+(lastW?lastW.kg:"75")+' kg" aria-label="Weight in kg"><input id="bwWaist" inputmode="decimal" placeholder="Waist cm" aria-label="Waist in cm (optional)"><button class="btn" data-act="addW">Log</button></div>'
      +(W.length?areaChart(W.map(x=>x.kg),W.map((x,i)=>i===0||i===W.length-1?f(x.d):""),"--amber",null,"kg",true):'')
      +summary
      +(W.length?'<div class="log">'+W.slice(-4).reverse().map(x=>'<div class="log-i"><span class="num muted">'+x.d+'</span><span class="row"><span class="num">'+x.kg+' kg'+(x.waist?' · '+x.waist+' cm':'')+'</span><button class="x" aria-label="Remove entry" data-act="rmW" data-d="'+x.d+'">×</button></span></div>').join("")+'</div>':'')
    +'</div>'
    +'<div class="glass stack"><div class="ctitle">Lift Progress</div><select id="liftSel" aria-label="Pick an exercise">'+opts+'</select>'
      +(hist.length?areaChart(hist.map(h=>h.v),hist.map((h,i)=>i===0||i===hist.length-1?f(h.d):""),"--teal",null,"kg",true)+'<div class="row between"><span class="small muted">Best set</span><b class="num">'+fmtW(best.v)+' kg × '+best.r+'</b></div><div class="small muted">'+hist.length+(hist.length===1?' session':' sessions')+'. The line shows your heaviest set each time.</div>'
        :'<div class="empty">No sets logged for this lift yet. Tick off sets in Workouts and your chart shows up here.</div>')
    +'</div>'
    +'<div class="glass"><div class="ctitle">How Your Plan Changes</div><p class="small muted" style="margin:8px 0 0">Fresh accessory moves every Monday for new angles. Main lifts stay for 4 weeks so you can keep adding weight. Hit the top rep on every set, then go up a little. Every 8th week is a lighter deload week.</p></div>'
    +(inFrame?'':'<div class="glass stack"><div class="ctitle">Backup</div><p class="small muted" style="margin:0">Your data lives on this phone. Save a backup now and then.</p><div class="row wrap"><button class="btn" data-act="export">Save backup</button><label class="btn ghost" for="importFile" tabindex="0" style="display:inline-block">Restore backup</label><input type="file" id="importFile" accept="application/json,.json" hidden></div><div id="bkMsg" class="small muted"></div></div>');
}

/* charts */
function areaChart(vals,labels,color,target,unit,fitRange){
  const w=340,h=160,pl=8,pr=8,pt=30,pb=22;
  if(vals.length===1){vals=[vals[0],vals[0]];labels=[labels[0],labels[0]];}
  let lo=0,hi=Math.max(target?target*1.15:0,...vals,1);
  if(fitRange){lo=Math.min(...vals);hi=Math.max(...vals);if(hi-lo<2){const m=(hi+lo)/2;lo=m-1;hi=m+1;}const pd=(hi-lo)*0.2;lo-=pd;hi+=pd;}
  const iw=w-pl-pr, ih=h-pt-pb;
  const x=i=>pl+i*iw/(vals.length-1), y=v=>pt+ih-((v-lo)/(hi-lo))*ih;
  // smooth path
  const pts=vals.map((v,i)=>[x(i),y(v)]);
  let d="M"+pts[0][0].toFixed(1)+" "+pts[0][1].toFixed(1);
  for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i],cx=(x0+x1)/2;d+=" C"+cx.toFixed(1)+" "+y0.toFixed(1)+" "+cx.toFixed(1)+" "+y1.toFixed(1)+" "+x1.toFixed(1)+" "+y1.toFixed(1);}
  const gid="g"+Math.random().toString(36).slice(2,8);
  let s='<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Trend chart"><defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var('+color+')" stop-opacity=".32"/><stop offset="1" stop-color="var('+color+')" stop-opacity="0"/></linearGradient></defs>';
  [0.25,0.5,0.75].forEach(t=>{const yy=pt+ih*t;s+='<line class="grid" x1="'+pl+'" x2="'+(w-pr)+'" y1="'+yy+'" y2="'+yy+'"/>';});
  if(target) s+='<line class="tline" x1="'+pl+'" x2="'+(w-pr)+'" y1="'+y(target)+'" y2="'+y(target)+'"/><text x="'+(w-pr)+'" y="'+(y(target)-5)+'" text-anchor="end">goal '+target+'</text>';
  s+='<path d="'+d+' L'+pts[pts.length-1][0].toFixed(1)+' '+(pt+ih)+' L'+pts[0][0].toFixed(1)+' '+(pt+ih)+' Z" fill="url(#'+gid+')"/>';
  s+='<path d="'+d+'" fill="none" stroke="var('+color+')" stroke-width="2.6" stroke-linecap="round"/>';
  let li=vals.length-1; for(let i=vals.length-1;i>=0;i--){if(vals[i]>0){li=i;break;}}
  const [lx,ly]=pts[li]; const txt=fmtW(vals[li])+" "+unit; const tw=txt.length*6+12;
  const tx=Math.min(Math.max(lx-tw/2,pl),w-pr-tw);
  s+='<line x1="'+lx+'" x2="'+lx+'" y1="'+ly+'" y2="'+(pt+ih)+'" stroke="var('+color+')" stroke-dasharray="2 3" opacity=".6"/>';
  s+='<circle cx="'+lx+'" cy="'+ly+'" r="5" fill="var(--white)" stroke="var('+color+')" stroke-width="2.5"/>';
  s+='<rect class="tipbg" x="'+tx+'" y="'+(ly-28)+'" width="'+tw+'" height="18" rx="6"/><text class="tiptx" x="'+(tx+tw/2)+'" y="'+(ly-15.5)+'" text-anchor="middle">'+txt+'</text>';
  labels.forEach((l,i)=>{if(l)s+='<text x="'+x(i)+'" y="'+(h-6)+'" text-anchor="'+(i===0?"start":i===labels.length-1?"end":"middle")+'">'+l+'</text>';});
  return s+'</svg>';
}
function barChart(vals,labels,target,color){
  const w=340,h=130,pl=4,pr=4,pt=10,pb=20; const max=Math.max(target*1.2,...vals,0.1);
  const iw=w-pl-pr, ih=h-pt-pb, bw=iw/vals.length; const y=v=>pt+ih-(v/max)*ih;
  let s='<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Bar chart">';
  s+='<line class="tline" x1="'+pl+'" x2="'+(w-pr)+'" y1="'+y(target)+'" y2="'+y(target)+'"/>';
  const bwid=Math.min(bw*0.55,16);
  vals.forEach((v,i)=>{const bh=Math.max((v/max)*ih,4);const hit=v>=target;
    s+='<rect x="'+(pl+i*bw+(bw-bwid)/2)+'" y="'+(pt+ih-bh)+'" width="'+bwid+'" height="'+bh+'" rx="'+(bwid/2)+'" fill="var('+color+')" opacity="'+(hit?1:v>0?0.45:0.15)+'"/>';
    if(labels[i]) s+='<text x="'+(pl+i*bw+bw/2)+'" y="'+(h-5)+'" text-anchor="middle">'+labels[i]+'</text>';});
  return s+'</svg>';
}

/* ===== Rest timer ===== */
let restEnd=0, restInt=null;
function startRest(sec,name){restEnd=Date.now()+sec*1000;$("#restLabel").textContent="Rest · "+name;const el=$("#rest");el.hidden=false;el.classList.remove("go");clearInterval(restInt);restInt=setInterval(tickRest,250);tickRest();}
function tickRest(){
  const left=Math.max(0,Math.round((restEnd-Date.now())/1000)); const el=$("#rest");
  $("#restTime").textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
  if(left<=0){clearInterval(restInt);el.classList.add("go");$("#restLabel").textContent="Rest done";$("#restTime").textContent="Next set";try{navigator.vibrate&&navigator.vibrate(200);}catch(e){}setTimeout(()=>{if(Date.now()>=restEnd)el.hidden=true;},4000);}
}
$("#restAdd").onclick=()=>{restEnd=Math.max(restEnd,Date.now())+15000;$("#rest").classList.remove("go");clearInterval(restInt);restInt=setInterval(tickRest,250);tickRest();};
$("#restSkip").onclick=()=>{clearInterval(restInt);$("#rest").hidden=true;};

/* ===== Backup (installed app only) ===== */
async function exportData(){
  const blob=new Blob([JSON.stringify({app:"vtaper",v:1,saved:new Date().toISOString(),data:S})],{type:"application/json"});
  const name="vtaper-backup-"+todayKey()+".json";
  try{const file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"V-Taper backup"});$("#bkMsg").textContent="Backup ready. Save it to Files or iCloud.";return;}
  }catch(e){if(e&&e.name==="AbortError")return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  $("#bkMsg").textContent="Backup saved as "+name+".";
}
document.addEventListener("change",ev=>{
  if(ev.target.id==="liftSel"){lsUi("lift",ev.target.value);renderProgress();}
  if(ev.target.id==="importFile"&&ev.target.files[0]){
    const r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result);if(o.app!=="vtaper"||!o.data)throw 0;loadInto(o.data);lsSet();renderAll();const m=$("#bkMsg");if(m)m.textContent="Backup restored.";}catch(e){$("#bkMsg").textContent="That file is not a V-Taper backup. Pick the .json file you saved.";}};
    r.readAsText(ev.target.files[0]);
  }
});

/* ===== Actions ===== */
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act, k=todayKey();
  if(a==="water"){const d=day(k);d.w=Math.max(0,d.w+(+b.dataset.v));save("days");rerender();}
  else if(a==="creatine"){const d=day(k);d.c=!d.c;save("days");rerender();}
  else if(a==="addP"){day(k).p.push([+b.dataset.g,b.dataset.n]);save("days");rerender();}
  else if(a==="meal"){const d=day(k);const id=b.dataset.id;const i=d.p.findIndex(x=>x[2]===id);
    if(i>=0)d.p.splice(i,1);else{const m=MEALS.find(x=>x.id===id);d.p.push([m.g,m.n+": "+m.d,m.id]);if(id==="sh")d.c=true;}
    save("days");rerender();}
  else if(a==="addCustom"){const g=parseInt($("#cpG").value,10);if(!(g>0)){$("#cpG").focus();return;}const n=$("#cpN").value.trim()||"Other";day(k).p.push([g,n.slice(0,40)]);save("days");rerender();}
  else if(a==="rmP"){day(k).p.splice(+b.dataset.i,1);save("days");rerender();}
  else if(a==="goFuel"){setTab("fuel");}
  else if(a==="openTrain"){trainView=null;weekOffset=0;openEx.clear();setTab("train");}
  else if(a==="trainDay"){trainView=b.dataset.p;openEx.clear();renderTrain();}
  else if(a==="wk"){weekOffset=+b.dataset.o;openEx.clear();renderTrain();}
  else if(a==="toggleEx"){const id=b.dataset.id;if(openEx.has(id))openEx.delete(id);else openEx.add(id);rebuildEx(id);}
  else if(a==="range"){statRange=+b.dataset.n;lsUi("range",statRange);renderProgress();}
  else if(a==="swap"){day(k).prog=b.dataset.p;trainView=b.dataset.p;weekOffset=0;openEx.clear();save("days");renderAll();}
  else if(a==="unswap"){delete day(k).prog;trainView=null;openEx.clear();save("days");renderAll();}
  else if(a==="set"){logSet(b.dataset.id,+b.dataset.i);}
  else if(a==="export"){exportData();}
  else if(a==="addW"){
    const kg=parseFloat($("#bwKg").value); if(!(kg>30&&kg<250)){$("#bwKg").focus();return;}
    const wa=parseFloat($("#bwWaist").value);
    const e={d:k,kg:Math.round(kg*10)/10}; if(wa>40&&wa<200)e.waist=Math.round(wa*10)/10;
    S.body.w=mergeW(S.body.w||[],[e]); save("body"); renderProgress();
  }
  else if(a==="rmW"){S.body.w=(S.body.w||[]).filter(x=>x.d!==b.dataset.d);save("body");renderProgress();}
});

function viewCtx(){
  const k=todayKey(); const w=weekOf(k)+weekOffset; const dk=trainView||progFor(k);
  if(dk==="match") return null;
  const P=plan(w)[dk]; const live=weekOffset===0&&dk===progFor(k);
  const prev=w>1?plan(w-1)[dk].ex.map(x=>x.id):[];
  return {P,live,w,prev};
}
function rebuildEx(id){
  const c=viewCtx(); if(!c) return; const e=c.P.ex.find(x=>x.id===id); if(!e) return;
  const card=document.getElementById("ex-"+id); if(!card) return;
  const typed={}; card.querySelectorAll("input").forEach(inp=>typed[inp.id]=inp.value);
  const tmp=document.createElement("div"); tmp.innerHTML=exCard(e,c.live,c.P.tone,c.w>1&&!c.prev.includes(id),isDeload(c.w)); card.replaceWith(tmp.firstChild);
  document.querySelectorAll("#ex-"+id+" input").forEach(inp=>{if(!inp.value&&typed[inp.id])inp.value=typed[inp.id];});
}
function logSet(id,i){
  const k=todayKey(); const P=PD(k); if(!P) return; const e=P.ex.find(x=>x.id===id); if(!e) return;
  if(!S.lifts[id]) S.lifts[id]=[];
  let s=S.lifts[id].find(x=>x.d===k); if(!s){s={d:k,s:[]};S.lifts[id].push(s);}
  let justDone=false;
  if(s.s[i]){ s.s[i]=null; }
  else{
    const wi=$("#w-"+id+"-"+i), ri=$("#r-"+id+"-"+i);
    let w=parseFloat(wi.value); if(isNaN(w)) w=parseFloat(wi.placeholder)||0;
    let r=parseInt(ri.value,10); if(isNaN(r)) r=parseInt(ri.placeholder,10)||0;
    if(r<=0){ri.focus();return;}
    s.s[i]=[w,r]; justDone=true; startRest(e.rest,e.n);
  }
  while(s.s.length&&!s.s[s.s.length-1]) s.s.pop();
  if(!s.s.length) S.lifts[id]=S.lifts[id].filter(x=>x!==s);
  if(S.lifts[id].length>24) S.lifts[id]=S.lifts[id].slice(-24);
  save("lifts");
  const finished=justDone&&s.s.filter(Boolean).length>=e.sets;
  if(finished){
    openEx.delete(id); const idx=P.ex.findIndex(x=>x.id===id); const nx=P.ex.slice(idx+1).find(x=>{const ss=sessionToday(x.id);return !ss||ss.s.filter(Boolean).length<x.sets;});
    rebuildEx(id); if(nx){openEx.add(nx.id);rebuildEx(nx.id);}
  } else {
    rebuildEx(id);
    if(justDone){const nw=$("#w-"+id+"-"+(i+1));if(nw&&!nw.value)nw.placeholder=fmtW(s.s[i][0]);}
  }
}

/* ===== Pull to refresh ===== */
(function(){
  const el=$("#ptr"), txt=$("#ptrText"), TH=70; let y0=null, dy=0, busy=false;
  function show(d){el.classList.remove("anim");const p=Math.min(d/TH,1);el.style.opacity=p;el.style.transform="translate(-50%,"+(-80+Math.min(d,TH+20)*1.1)+"px)";
    const ready=d>=TH;el.classList.toggle("ready",ready);txt.textContent=ready?"Release to refresh":"Pull to refresh";}
  function hide(){el.classList.add("anim");el.style.opacity=0;el.style.transform="translate(-50%,-80px)";el.classList.remove("ready","busy");}
  document.addEventListener("touchstart",e=>{
    if(busy||window.scrollY>0||e.touches.length!==1||e.target.closest("input,select,textarea,.scroller,.rest")){y0=null;return;}
    y0=e.touches[0].clientY; dy=0;
  },{passive:true});
  document.addEventListener("touchmove",e=>{
    if(y0===null) return; const d=e.touches[0].clientY-y0;
    if(d<=0||window.scrollY>0){if(dy>0)hide();dy=0;return;}
    dy=d*0.55; if(dy>4&&e.cancelable) e.preventDefault(); show(dy);
  },{passive:false});
  document.addEventListener("touchend",()=>{
    if(y0===null) return; y0=null;
    if(dy>=TH) refresh(); else hide(); dy=0;
  });
  async function refresh(){
    busy=true; el.classList.add("anim","busy"); el.classList.remove("ready"); el.style.opacity=1; el.style.transform="translate(-50%,0)"; txt.textContent="Refreshing";
    if(!inFrame){
      try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(reg)await reg.update();}catch(e){}
      location.reload(); return;
    }
    try{await connect();}catch(e){}
    renderAll(); txt.textContent="Up to date";
    setTimeout(()=>{hide();busy=false;},700);
  }
})();

/* ===== Tabs ===== */
function setTab(t){
  tab=t; lsUi("tab",t);
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t?"true":"false"));
  ["today","train","fuel","progress"].forEach(v=>document.getElementById("v-"+v).hidden=v!==t);
  rerender(); window.scrollTo(0,0);
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
function rerender(){
  if(tab==="today")renderToday(); else if(tab==="train")renderTrain(); else if(tab==="fuel")renderFuel(); else renderProgress();
}
function renderAll(){trimDays();rerender();}

let lastKey=todayKey();
setInterval(()=>{if(todayKey()!==lastKey){lastKey=todayKey();trainView=null;weekOffset=0;openEx.clear();rerender();} else if(tab==="today"){renderToday();}},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&tab!=="train")rerender();});

setTab(tab);
connect();
if(!inFrame&&"serviceWorker" in navigator&&location.protocol==="https:"){try{navigator.serviceWorker.register("sw.js");}catch(e){}}
})();
</script>
